<script>
const R=String.raw;
const CH=["All","1 Intro","2 Structures","3 Processes","4 Threads","5 Sync","6 Scheduling"];
// [chapter, kind(f=fact,c=compare/4-traits), question, answer]
const D=[
[1,'f','What are the two roles of an OS?','Resource allocator: manages CPU, memory, disk, I/O and decides between conflicting requests fairly and efficiently.\nControl program: controls execution of programs to prevent errors and improper use.'],
[1,'f','Explain dual-mode operation and how the switch happens.','Hardware mode bit: user mode (restricted) vs kernel mode (privileged). A system call traps to the OS, setting kernel mode; on return the bit is reset to user mode. Protects the OS from rogue programs.'],
[1,'f','Why does the OS need a timer?','The timer interrupts the CPU after a set time so a program stuck in an infinite loop cannot keep the CPU forever; the OS regains control.'],
[1,'c','Interrupt vs trap.','Interrupt: hardware-generated, asynchronous (I/O done, timer).\nTrap/exception: software-generated, synchronous: error (divide by zero) or a system call.'],
[1,'c','Program vs process.','Program: passive, code on disk.\nProcess: active, a program in execution in memory with a PC, registers, stack and resources.'],
[1,'c','Multiprogramming vs timesharing.','Multiprogramming: several jobs in memory; switch when one waits for I/O. Goal: CPU utilisation.\nTimesharing: rapid switching on a timer so users get interactive response (<1s). Goal: responsiveness.'],
[1,'c','Asymmetric vs symmetric multiprocessing.','Asymmetric: a boss CPU assigns work to worker CPUs.\nSMP: all CPUs are peers and each can run any task (most common today).'],
[1,'c','4 management responsibilities of an OS.','Process management; memory management; storage management (file system + mass storage); protection and security.'],
[1,'f','Why use DMA?','Device moves a whole block directly to memory without CPU involvement; the CPU gets one interrupt per block, not one per byte.'],
[1,'c','Protection vs security.','Protection: internal control of access to resources (permissions, user/group IDs).\nSecurity: defence against external attacks (viruses, worms, DoS).'],
[2,'f','Policy vs mechanism.','Mechanism: HOW something is done. Policy: WHAT will be done. Separate them so policy can change without rewriting the mechanism.'],
[2,'f','3 ways parameters are passed to the OS in a system call.','Registers; a block/table in memory with its address in a register; pushed onto the stack by the program and popped by the OS.'],
[2,'f','System call vs API.','System call: the actual entry point into the kernel. API (e.g. POSIX, Win32): the function set programmers use, which usually calls system calls on their behalf.'],
[2,'c','Monolithic kernel vs microkernel.','Monolithic: everything in kernel space; fast, but big and one bug can crash all.\nMicrokernel: only minimal services in kernel, rest in user space; easier to extend and more secure, but slower due to message passing.'],
[2,'c','4 OS services that help the user.','User interface; program execution; I/O operations; file-system manipulation (also communication, error detection).'],
[2,'c','System programs vs application programs.','System programs give a convenient environment (file tools, status, compilers, loaders).\nApplication programs do user tasks (browser, word processor) and run on top.'],
[3,'f','Name the 5 process states and 2 transitions that cause Running→Ready and Waiting→Ready.','New, Ready, Running, Waiting, Terminated.\nRunning→Ready: time quantum expires (timer interrupt). Waiting→Ready: I/O or event completes.'],
[3,'f','What does the PCB contain?','Process state, PID, program counter, CPU registers, scheduling info (priority), memory-management info, accounting, I/O status.'],
[3,'f','Process in memory: 4 sections.','Text (code), data (globals), heap (dynamic memory), stack (function calls, locals).'],
[3,'c','Long-term vs short-term vs medium-term scheduler.','Long: picks jobs to load into memory, controls degree of multiprogramming, runs rarely.\nShort (CPU scheduler): picks next ready process, runs very often.\nMedium: swaps processes out/in to reduce load.'],
[3,'c','fork() vs exec().','fork() creates a child that is a duplicate of the parent (new PID). exec() replaces the calling process\'s memory image with a new program.'],
[3,'c','Shared memory vs message passing.','Shared memory: fast (no kernel after setup), but needs synchronisation.\nMessage passing: kernel-mediated send/receive, easier, good for distributed, slower.'],
[3,'f','Zombie vs orphan.','Zombie: child finished but parent has not called wait(); entry stays in process table.\nOrphan: parent ended first; child is adopted by init.'],
[3,'f','What happens in a context switch? Why is it overhead?','Save state of the old process into its PCB, load the new one\'s from its PCB. No useful work is done during the switch.'],
[4,'c','Process vs thread.','Process: own address space and resources, heavy to create.\nThread: unit of CPU use inside a process; shares code, data, files; own PC, registers, stack. Cheaper.'],
[4,'c','4 benefits of multithreading.','Responsiveness; resource sharing; economy (cheaper than processes); scalability on multicore.'],
[4,'c','Concurrency vs parallelism.','Concurrency: multiple tasks make progress (can be interleaved on 1 core).\nParallelism: tasks truly run at the same time on multiple cores.'],
[4,'f','State Amdahl\'s Law.','speedup ≤ 1 / (S + (1−S)/N), S = serial fraction, N = cores. The serial part limits gains.'],
[4,'c','Many-to-one vs one-to-one vs many-to-many.','Many-to-one: one blocking call blocks all, no parallelism. One-to-one: full concurrency, but one kernel thread per user thread. Many-to-many: multiplexes many user threads onto fewer kernel threads.'],
[4,'f','Why use a thread pool?','Reuses pre-created threads: faster than creating one per request, and bounds the number of threads.'],
[5,'f','What is a race condition?','Outcome depends on the order of access to shared data, e.g. two threads doing counter++ (load, add, store) can lose an update.'],
[5,'c','3 requirements of a critical-section solution.','Mutual exclusion; progress; bounded waiting.'],
[5,'f','Peterson\'s solution: shared variables?','int turn; boolean flag[2]. Set flag[i]=true, give turn to j; wait while flag[j] && turn==j.'],
[5,'f','Semaphore wait() and signal().','wait: value--, if value&lt;0 block. signal: value++, if value&lt;=0 wake a waiting process. Both atomic.'],
[5,'c','Mutex vs semaphore.','Mutex: lock, binary, owned by the thread that locked it.\nSemaphore: integer; counting semaphores control a number of resources, also used for ordering.'],
[5,'f','Busy waiting vs blocking semaphore.','Busy waiting spins in a loop, wasting CPU (spinlock). Blocking puts the process in a waiting queue and wakes it on signal().'],
[5,'f','Semaphores for bounded buffer of size n?','mutex=1, empty=n, full=0. Producer: wait(empty), wait(mutex)...signal(mutex), signal(full).'],
[6,'c','5 scheduling criteria.','CPU utilisation; throughput; turnaround time; waiting time; response time.'],
[6,'f','Convoy effect.','In FCFS, short processes wait behind one long CPU-bound process.'],
[6,'f','Starvation and aging.','In priority scheduling low-priority processes may never run. Aging gradually raises the priority of waiting processes.'],
[6,'f','Effect of time quantum in RR.','Too large: behaves like FCFS. Too small: too many context switches.'],
[6,'f','Why is SJF optimal but hard to implement?','Minimum average waiting time, but the next CPU burst is unknown; predict with exponential averaging: τ(n+1)=α·t(n)+(1−α)·τ(n).'],
[6,'c','Multilevel queue vs multilevel feedback queue.','MLQ: fixed queues, processes never move.\nMLFQ: processes move; those using full quantum are demoted, long-waiting ones promoted (aging).'],
[6,'c','Soft vs hard affinity; push vs pull migration.','Soft: OS tries to keep a process on a CPU. Hard: strictly pinned.\nPush: monitor moves tasks off busy CPUs. Pull: idle CPU takes tasks.'],
[6,'f','Little\'s formula.','n = λ × W. e.g. 14 in queue, 7 arrive/sec → W = 2 s.'],
[6,'c','Rate monotonic vs EDF.','RM: static priority, shorter period = higher priority. EDF: dynamic, earliest deadline first; optimal on one CPU.']
];
// Code questions
const C=[
{ch:3,t:'Count the fruit',src:'Assignment 1, Running 1 Q3 (fruit_Basket.c) · Ch3 process creation',type:'Analyse',q:'How many fruits print in total, and how many of each?',code:R`printf("Sapodilla\n");
fork();
printf("Pommerac\n");
fork();
printf("Mango\n");`,ans:'7 fruits: 1 Sapodilla, 2 Pommerac, 4 Mango.',why:'fork() copies the process and both continue from the next line. Each fork doubles the number of processes (1→2→4), and every process runs every later line. Pattern: 2^k processes after k forks.'},
{ch:3,t:'Recursive fork',src:'Assignment 1, Running 1 Q2 (calc) · process trees',type:'Analyse',q:'calc(9): how many child processes are created and how many times is Hello printed?',code:R`void calc(int n) {
  if (n > 0) {
    fork();
    printf("Hello\n");
    calc(n-1);
  }
}`,ans:'511 children, "Hello" printed 1022 times.',why:'At each level every existing process forks, so after level k there are 2^k processes and each prints once: 2+4+…+512 = 1022. Children = 2^9 − 1 = 511. NOTE: your study guide says 511 prints; that is the child count, not the print count. Check with calc(2): 2+4 = 6 prints, 3 children.'},
{ch:3,t:'Loop after fork',src:'Lab 3, simple_fork_2.c',type:'Analyse',q:'How many lines are printed (terminal output)?',code:R`printf("Before fork\n");
pid_t pid = fork();
for (int i = 0; i < 5; i++)
  printf("Loop %d from PID %d\n", i, getpid());`,ans:'11 lines: 1 "Before fork" + 5 from parent + 5 from child.',why:'"Before fork" runs once, before the copy exists. After fork both processes run the loop. Parent/child lines can interleave: the scheduler decides.'},
{ch:3,t:'Fork return value',src:'Lab 3, child_pid_2.c',type:'Fill the blanks',q:'Fill the two comparison operators.',code:R`pid_t pid = fork();
if (pid ___ 0)       { /* fork failed */ }
else if (pid ___ 0)  { /* child */ }
else                 { /* parent: pid = child's PID */ }`,ans:'< and ==',why:'fork returns −1 on failure, 0 in the child, and the child\'s PID in the parent. This is how one program tells the two processes apart.'},
{ch:3,t:'Parent waits',src:'Lab 3, wait_on_child_2.c',type:'Fill the blank',q:'Make the parent print only after the child finishes.',code:R`if (pid == 0) {
  for (int i=0;i<100000;i++) printf("Child-%d\n", i);
} else {
  ___(NULL);   // blocks parent
  for (int j=0;j<100000;j++) printf("Parent-%d\n", j);
}`,ans:'wait',why:'wait(NULL) (needs <sys/wait.h>) moves the parent to the Waiting state until a child terminates. Without it, output interleaves. It also prevents zombies.'},
{ch:3,t:'After exec',src:'Lab 3, overlay_child_2.c',type:'Analyse',q:'When is "Done" printed?',code:R`execl("/bin/ls", "ls", "-l", NULL);
printf("Done\n");`,ans:'Only if execl fails (returns −1).',why:'On success exec replaces the whole process image, so later lines never run. That is why shells fork() first, and exec() in the child.'},
{ch:3,t:'Pipe plumbing',src:'Assignment 1, myshell.c (pipe |)',type:'Fill the blanks',q:'Implement ls | wc -l: fill the two dup2 arguments.',code:R`int fd[2]; pipe(fd);
if (fork() == 0) {          // left: ls
  dup2(___, STDOUT_FILENO);
  close(fd[0]); close(fd[1]);
  execlp("ls","ls",NULL);
}
if (fork() == 0) {          // right: wc
  dup2(___, STDIN_FILENO);
  close(fd[0]); close(fd[1]);
  execlp("wc","wc","-l",NULL);
}
close(fd[0]); close(fd[1]);
wait(NULL); wait(NULL);`,ans:'fd[1] then fd[0]',why:'fd[0] = read end, fd[1] = write end. ls writes into the pipe, wc reads from it. Unused ends must be closed or wc never sees EOF. This is IPC by message passing (Ch3).'},
{ch:3,t:'8-mark: write it',src:'Typical 8-mark parent/child question · Lab 3',type:'Write code',q:'Write a program: the parent forks one child. The child prints its PID then runs "ls -l". The parent waits, then prints "Child finished". Handle fork failure.',code:R`#include <stdio.h>
#include <unistd.h>
#include <sys/wait.h>
int main(void) {
  // your code
}`,ans:R`pid_t pid = fork();
if (pid < 0) { perror("fork"); return 1; }
else if (pid == 0) {
  printf("Child PID %d\n", getpid());
  execl("/bin/ls", "ls", "-l", NULL);
  perror("exec"); _exit(1);
} else {
  wait(NULL);
  printf("Child finished\n");
}
return 0;`,why:'Marks usually: includes (1), fork + error check (2), child branch with exec (2), parent wait (2), print (1). Memorise the pattern fork → branch on pid → exec in child → wait in parent.'},
{ch:5,t:'Bounded-buffer producer',src:'Ch5 classical problems · producer-consumer',type:'Fill the blanks',q:'Fill the four semaphores in order (mutex=1, empty=n, full=0).',code:R`while (1) {
  /* produce item */
  wait(___);   // free slot
  wait(___);   // lock buffer
  /* insert item */
  signal(___); // unlock
  signal(___); // item available
}`,ans:'empty, mutex, mutex, full',why:'Wait on empty BEFORE mutex. If the producer locks mutex first and the buffer is full, it sleeps holding the lock and the consumer can never free a slot: deadlock.'},
{ch:5,t:'Peterson\'s solution',src:'Ch5 software solutions to critical section',type:'Fill the blanks',q:'Process i, other process j. Fill the blanks.',code:R`flag[i] = true;
turn = ___;
while (flag[___] && turn == ___);
/* critical section */
flag[i] = ___;`,ans:'j, j, j, false',why:'Process i politely gives the turn to j. It waits only while j wants in AND it is j\'s turn. Satisfies mutual exclusion, progress and bounded waiting.'},
{ch:6,t:'FCFS waiting time (runnable)',src:'Ch6 FCFS · convoy effect',type:'Fill + run',run:1,q:'Bursts 24, 3, 3 arrive together. Fill the formula, run it, and explain why the average is so bad.',code:R`#include <stdio.h>
int main() {
  int burst[3] = {24, 3, 3};
  int w[3], total = 0, i;
  w[0] = 0;
  for (i = 1; i < 3; i++)
    w[i] = ___;
  for (i = 0; i < 3; i++) total += w[i];
  printf("Average wait = %d\n", total / 3);
  return 0;
}`,ans:'w[i-1] + burst[i-1]  → waits 0, 24, 27, average 17.',why:'Each process waits for everyone ahead of it. The 24 burst first causes the convoy effect. SJF order (3,3,24) gives 0,3,6 → average 3. See Algorithm Lab.'},
{ch:6,t:'Round Robin by hand',src:'Ch6 RR · Gantt charts',type:'Calculate',q:'P1=24, P2=3, P3=3, all arrive at 0, quantum 4. Draw the Gantt chart and find average waiting time. Verify in Algorithm Lab.',code:'',ans:'Gantt: P1 0-4, P2 4-7, P3 7-10, P1 10-30. Waits: P1=6, P2=4, P3=7 → average 5.67.',why:'Wait = finish − arrival − burst. P1: 30−0−24=6. Beats FCFS (17) and keeps response time low. Exam tip: show the queue at each step.'},
{ch:4,t:'Creating a thread',src:'Ch4 Pthreads',type:'Fill the blanks',q:'Fill in the function and the thread variable.',code:R`void *runner(void *param);
pthread_t tid;
pthread_create(&tid, NULL, ___, (void*)&n);
pthread_join(___, NULL);`,ans:'runner, tid',why:'pthread_create(thread, attrs, start routine, arg) starts the thread. pthread_join waits for it, like wait() does for a child process. Threads share globals; processes do not.'},
{ch:2,t:'Reading /proc',src:'Tutorial 2 getinfo.c · system/file calls',type:'Fill the blanks',q:'Print the CPU model: the text after the colon in the "model name" line.',code:R`while (fgets(line, sizeof(line), fp)) {
  if (strstr(line, "___") != NULL) {
    char *s = ___(line, ':');
    printf("CPU Model:%s", s + 1);
    break;
  }
}`,ans:'model name, strchr',why:'strstr finds a substring in a line, strchr finds the first colon and returns a pointer to it, so s+1 skips it. /proc is a kernel-provided view of OS data.'}
];
// 15-mark
const L=[
{ch:1,t:'Dual-mode operation and protection',parts:[['Define user and kernel mode (3)'],['Trace what happens on a system call (4)'],['Role of the timer and I/O protection (4)'],['Why is it needed? (4)']],ans:'(a) User mode: restricted, applications. Kernel mode: privileged, OS, any instruction.\n(b) Program calls library function → trap instruction → mode bit set to kernel → OS validates parameters, runs service → mode bit reset to user → returns result.\n(c) Timer interrupts after fixed time so the OS regains CPU (stops infinite loops). I/O instructions are privileged: user programs must request I/O via system calls.\n(d) Without it any program could overwrite the OS, hog the CPU or access other programs\' memory.',why:'Longish topics combine definition + mechanism + justification. Your marks come from covering all 4 parts, even briefly.'},
{ch:1,t:'Interrupts, DMA and storage',parts:[['Interrupt handling steps (5)'],['Storage hierarchy and caching (5)'],['Why DMA? (5)']],ans:'(a) Device signals → CPU finishes instruction → saves state (PC, registers) → looks up the interrupt vector → runs ISR → restores state, resumes.\n(b) Registers → cache → RAM → SSD → HDD → tape: faster is smaller, costlier and volatile. Caching copies used data into faster storage; works due to temporal and spatial locality.\n(c) Without DMA the CPU copies every byte. With DMA the controller transfers a block to memory and interrupts once.',why:'Ties together Tutorial 1 (fetch-execute, locality) and Ch1 I/O structure.'},
{ch:2,t:'Services, system calls, parameters',parts:[['6 OS services (6)'],['System call vs API (4)'],['3 parameter-passing methods (5)']],ans:'(a) UI, program execution, I/O operations, file-system manipulation, communication, error detection (plus allocation, accounting, protection).\n(b) System call = kernel entry point; API = function set (POSIX/Win32) wrapping them. Example: printf → write().\n(c) Registers; memory block with its address in a register; stack. Block/stack methods allow many parameters.',why:'Short memorisable lists, then a relationship (API wraps system calls).'},
{ch:2,t:'OS structures',parts:[['Compare monolithic, layered, microkernel, modules (8)'],['Advantages and disadvantages of microkernel (4)'],['Policy vs mechanism (3)']],ans:'(a) Monolithic: all in one kernel, fast, hard to maintain. Layered: each layer uses lower ones, easy to debug, less efficient. Microkernel: minimal kernel + user-space services. Modules: loadable parts (Linux), flexible and efficient.\n(b) + extensible, secure, portable. − message-passing overhead.\n(c) Mechanism = how; policy = what. Example: timer is a mechanism, quantum length a policy.',why:'Compare/contrast scaled up. Use a table-like layout in your answer.'},
{ch:3,t:'Process life cycle',parts:[['Draw/describe 5 states and transitions (6)'],['PCB (4)'],['Context switch (5)']],ans:'(a) New→Ready (admitted); Ready→Running (dispatched); Running→Ready (interrupt/timeout); Running→Waiting (I/O request); Waiting→Ready (I/O done); Running→Terminated. No Ready→Waiting (a process must be running to request I/O) and no Waiting→Running (must queue in Ready first).\n(b) State, PID, PC, registers, scheduling, memory, accounting, I/O.\n(c) Save old state into PCB, load new from PCB; pure overhead, hardware-dependent.',why:'Straight from Tutorial 2 and Running 1 Q1 (missing transitions).'},
{ch:3,t:'IPC and process creation',parts:[['fork/exec/wait (5)'],['Shared memory vs message passing (6)'],['Direct/indirect, blocking/non-blocking (4)']],ans:'(a) fork duplicates; exec replaces image; wait blocks parent until child ends; exit terminates; zombie/orphan.\n(b) Shared memory: fast, needs synchronisation. Message passing: send/receive via kernel, simpler, slower.\n(c) Direct: name the process. Indirect: mailbox/port. Blocking send waits for receipt; both blocking = rendezvous.',why:'Links Lab 3 code to theory.'},
{ch:4,t:'Multithreading and Amdahl\'s law',parts:[['4 benefits (4)'],['3 multithreading models (6)'],['App is 25% serial. Speedup with 2 and 4 cores? (5)']],ans:'(a) Responsiveness, resource sharing, economy, scalability.\n(b) Many-to-one: no parallelism, blocking blocks all. One-to-one: parallel but costly. Many-to-many: flexible.\n(c) speedup = 1/(S+(1−S)/N). N=2: 1/(0.25+0.375)=1.6. N=4: 1/(0.25+0.1875)=2.29. Limit as N→∞ is 4.',why:'Typical exam pairing: theory + small calculation.'},
{ch:4,t:'Threading issues',parts:[['fork/exec in threads (4)'],['Cancellation and signals (5)'],['Thread pools and implicit threading (6)']],ans:'(a) fork may duplicate all threads or only the caller; exec replaces the whole process.\n(b) Asynchronous cancellation is immediate and unsafe; deferred checks at cancellation points. Signals go to the process, the thread or a designated one.\n(c) Thread pool: pre-created threads reused for tasks. OpenMP: compiler directives. GCD: blocks dispatched to a pool.',why:'Lists issues plus why each is a problem.'},
{ch:5,t:'Critical section problem',parts:[['Race condition with counter++ (4)'],['3 requirements (3)'],['Peterson\'s solution and why it works (8)']],ans:'(a) counter++ = load, add, store. Interleaving two threads can lose an update (5 then 4 instead of 6).\n(b) Mutual exclusion, progress, bounded waiting.\n(c) flag[i]=true; turn=j; while(flag[j]&&turn==j);. Mutual exclusion: both can\'t pass as turn is one value. Progress and bounded waiting: if j is not interested the loop exits, else j enters once and i follows. Weakness: may fail on modern reordering CPUs.',why:'Know the code and the three-property argument.'},
{ch:5,t:'Classical problems',parts:[['Bounded buffer (5)'],['Readers-writers (5)'],['Dining philosophers deadlock and fixes (5)']],ans:'(a) mutex=1, empty=n, full=0. Producer: wait(empty), wait(mutex), insert, signal(mutex), signal(full). Consumer mirrors.\n(b) rw_mutex for writers, mutex for read_count; first reader locks writers out, last reader releases.\n(c) If all 5 pick up the left chopstick, deadlock. Fixes: at most 4 seated, pick up both only if both available, asymmetric order.',why:'Know each problem\'s semaphores and the reason for their order.'},
{ch:6,t:'Scheduling calculation',parts:[['P1(0,8) P2(1,4) P3(2,9) P4(3,5): FCFS Gantt, avg wait (5)'],['Preemptive SJF (SRTF) Gantt, avg wait (6)'],['Compare (4)']],ans:'(a) FCFS: P1 0-8, P2 8-12, P3 12-21, P4 21-26. Waits 0, 7, 10, 18 → 8.75.\n(b) SRTF: P1 0-1, P2 1-5, P4 5-10, P1 10-17, P3 17-26. Waits P1 9, P2 0, P3 15, P4 2 → 6.5.\n(c) SRTF is better on average, but needs burst prediction and can starve long jobs.',why:'Calculation questions score by method. Check yours in Algorithm Lab.'},
{ch:6,t:'Compare algorithms and extras',parts:[['FCFS, SJF, Priority, RR: strengths/weaknesses (8)'],['MLFQ (4)'],['Affinity, load balancing, real-time (3)']],ans:'(a) FCFS: simple, convoy effect. SJF: optimal wait, unpredictable bursts. Priority: starvation fixed by aging. RR: good response, quantum choice matters.\n(b) New jobs enter top queue; using a full quantum demotes; waiting too long promotes.\n(c) Soft/hard affinity keeps cache warm; push/pull balance; EDF and rate monotonic for real-time.',why:'Compare/contrast + algorithm knowledge combined.'}
,{ch:1,t:'Architecture and OS types',parts:[['Asymmetric vs symmetric multiprocessing (5)'],['Clustered systems (4)'],['Multiprogramming vs timesharing (6)']],ans:'(a) Asymmetric: a boss CPU assigns work to workers; simple but the boss is a bottleneck. SMP: peers, any CPU runs any task; most common.\n(b) Independent computers networked with shared storage; high availability because another node takes over on failure.\n(c) Multiprogramming keeps several jobs in memory and switches on I/O wait to maximise CPU use. Timesharing switches on a timer so each user gets interactive response (under 1 second); needs scheduling and memory protection.',why:'Compare/contrast scaled to 15 marks: define, contrast, state the goal of each.'},
{ch:1,t:'Management duties and environments',parts:[['4 management responsibilities with examples (8)'],['3 kernel data structures and uses (3)'],['4 computing environments (4)']],ans:'(a) Process: create, delete, schedule, synchronise. Memory: track use, load or swap, allocate. Storage: files, directories, free space, disk scheduling. Protection and security: permissions vs external attacks.\n(b) Linked lists for queues; hash maps for lookups; bitmaps for free blocks.\n(c) Mobile, client-server, peer-to-peer, virtualisation, cloud, real-time embedded.',why:'A short use or example next to each list item earns the marks.'},
{ch:2,t:'Boot process and system programs',parts:[['Boot steps (5)'],['System program categories (5)'],['Why separate system from application programs (5)']],ans:'(a) Power on → bootstrap program in ROM/EPROM initialises hardware → loads the kernel from disk → kernel starts and runs init.\n(b) File management, status information, file modification, programming-language support, program loading, communications.\n(c) System programs give a convenient environment and sit between the user and system calls; most users see these, not the system calls.',why:'Straight recall; write the steps in order.'},
{ch:2,t:'System call categories and policy vs mechanism',parts:[['6 system call categories (6)'],['Policy vs mechanism with 2 examples (5)'],['How an API call becomes a system call (4)']],ans:'(a) Process control, file management, device management, information maintenance, communication, protection.\n(b) Mechanism = how; policy = what. Timer is a mechanism, quantum length a policy. Protection mechanism vs who gets access.\n(c) Program calls API function (e.g. printf) → library places the system call number in a register → trap → kernel looks up its table → runs the service → returns to user mode.',why:'Gives a 15-mark answer from short lists plus a worked flow.'},
{ch:3,t:'Queues and schedulers',parts:[['Ready and device queues (4)'],['Long, short, medium-term schedulers (6)'],['I/O-bound vs CPU-bound mix (5)']],ans:'(a) Ready queue: processes in memory waiting for the CPU (linked list of PCBs). Device queue: processes waiting for a specific I/O device.\n(b) Long: admits jobs, controls degree of multiprogramming, infrequent. Short: picks the next process, runs often, must be fast. Medium: swaps out/in.\n(c) I/O-bound: many short CPU bursts. CPU-bound: few long ones. A good mix keeps both CPU and devices busy.',why:'Ties Ch3 to Ch6: scheduler theory comes back in scheduling questions.'},
{ch:3,t:'fork output analysis and termination',parts:[['Trace: fork(); fork(); printf("A"); (5)'],['Zombie and orphan (5)'],['Cascading termination (5)']],ans:'(a) 2 forks → 4 processes → "A" printed 4 times. Draw the tree: 1 parent, 2 children, 1 grandchild.\n(b) Zombie: child ended, parent has not called wait(); entry stays in the process table. Orphan: parent ended first; init adopts the child.\n(c) Some systems kill all children when the parent ends; UNIX re-parents them instead.',why:'Matches Assignment 1 Running 1: the exam may give a snippet and ask for output and explanation.'},
{ch:4,t:'User vs kernel threads, libraries',parts:[['User vs kernel threads (6)'],['Pthreads, Windows, Java libraries (5)'],['Linux clone() (4)']],ans:'(a) User threads: managed by a library, fast to create, one blocking call can block the process. Kernel threads: managed by the OS, true parallelism, slower.\n(b) Pthreads (POSIX spec), Win32 threads, Java threads built on host OS.\n(c) clone() creates a thread-like task sharing the parent address space; fork() duplicates it.',why:'Compare/contrast with justification.'},
{ch:4,t:'Process vs thread costs and OS examples',parts:[['Why thread creation is cheaper (5)'],['Windows vs Linux threads (5)'],['Hyper-threading and multicore challenges (5)']],ans:'(a) Threads share code, data and files so no new address space is built; less to copy and a cheaper context switch.\n(b) Windows: one-to-one with ETHREAD/KTHREAD/TEB. Linux: tasks created via clone() with sharing flags.\n(c) Challenges: dividing activities, balance, data splitting, data dependency, testing and debugging.',why:'Pulls in the multicore design challenges.'},
{ch:5,t:'Mutex, spinlock, semaphore implementation',parts:[['Mutex lock with acquire/release (4)'],['Spinlock cost (3)'],['Semaphore without busy waiting (8)']],ans:'(a) acquire(): while(!available); available=false;  release(): available=true.\n(b) Spinlock wastes CPU while spinning but avoids a context switch; good for short waits on multiprocessors.\n(c) Semaphore has value and a waiting list. wait: value--; if value<0, add to list and block(). signal: value++; if value<=0 remove one from list and wakeup().',why:'Know the blocking implementation line by line.'},
{ch:5,t:'Hardware support and monitors',parts:[['test_and_set (5)'],['Monitor structure and condition variables (6)'],['Why monitors beat semaphores (4)']],ans:'(a) test_and_set atomically returns the old value and sets lock=true; loop while it returns true. compare_and_swap similar.\n(b) A monitor has shared data and procedures; only one process is active inside at a time. Conditions use wait() and signal().\n(c) Compiler enforces mutual exclusion, so no forgotten or swapped wait/signal.',why:'Include the code idea, not just the definition.'},
{ch:6,t:'FCFS vs SJF vs RR calculation',parts:[['P1=10,P2=4,P3=6 all at 0: FCFS avg wait (4)'],['SJF (4)'],['RR with q=4 Gantt and avg wait (5)'],['Conclusion (2)']],ans:'(a) FCFS: P1 0-10, P2 10-14, P3 14-20. Waits 0,10,14 → 8.\n(b) SJF: P2 0-4, P3 4-10, P1 10-20. Waits 10,0,4 → 4.67.\n(c) RR: P1 0-4, P2 4-8, P3 8-12, P1 12-16, P3 16-18, P1 18-20. Waits P1 10, P2 4, P3 12 → 8.67.\n(d) SJF is best; RR gives best response time at the cost of waiting.',why:'Wait = finish − arrival − burst. Check it in Algorithm Lab.'},
{ch:6,t:'Multiprocessor, real-time, evaluation',parts:[['Little formula problem: 7 arrive/s, 14 in queue (3)'],['Rate monotonic vs EDF (5)'],['Affinity and load balancing (4)'],['Evaluation methods (3)']],ans:'(a) n = λW → W = 14/7 = 2 s.\n(b) RM: static, shorter period = higher priority, may miss deadlines. EDF: dynamic, earliest deadline first, optimal on one CPU.\n(c) Soft/hard affinity keep cache warm; push and pull migration balance load.\n(d) Deterministic modelling, queueing models, simulation, implementation.',why:'A mixed question: one calculation and three short compare points.'}

const nrm=s=>s.toLowerCase().replace(/\s+/g,''),nz=s=>s.replace(/\s+/g,' ').trim();
function runC(src,inp){let s='';try{if(!window.JSCPP)throw Error('C interpreter did not load (needs internet)');JSCPP.run(src,inp,{stdio:{write:x=>s+=x}});return{o:s}}catch(e){return{o:s,e:String(e.message||e)}}}
function gut(k){$('#g'+k).textContent=Array.from({length:$('#w'+k).value.split('\n').length},(_,i)=>i+1).join('\n')}
function exam(){app.innerHTML='<p class="mu">Write the code, then Run (Ctrl+Enter) with your own stdin, or Submit to test it. The first 6 run in the browser; fork/exec/pipe ones cannot, so Submit checks for the required parts and you compare with the model answer.</p><h2>Write the code</h2>'+W.map((w,k)=>`<div class="box"><div class="tag">Ch ${w.ch} · ${w.tc?'Runs in browser':'Structure check'}</div><h3>${k+1}. ${w.t}</h3><p>${w.q}</p><div class="ide"><pre class="gut" id="g${k}"></pre><textarea class="ed" id="w${k}" spellcheck="false" wrap="off" data-k="${k}">${esc(w.code)}</textarea></div>${w.tc?`<textarea id="in${k}" rows="3" placeholder="stdin for Run, one line per row"></textarea>`:''}<div class="row"><button data-wr="${k}">Run</button><button data-ws="${k}">Submit</button><button data-wm="${k}">Model answer</button></div><pre class="out" id="wo${k}" hidden></pre><div id="wmx${k}" hidden></div></div>`).join('')+'<h2>Fill in the blanks</h2>'+F.map((f,k)=>`<div class="box" id="f${k}"><div class="tag">Ch ${f.ch}</div><h3>${k+1}. ${f.t}</h3><pre>${esc(f.code).replace(/___/g,'<input class="bl" size="10">')}</pre><div class="row"><button data-fc="${k}">Check</button></div><div id="fr${k}"></div></div>`).join('');
W.forEach((w,k)=>{gut(k);$('#w'+k).onscroll=e=>$('#g'+k).scrollTop=e.target.scrollTop});
app.oninput=e=>{if(e.target.dataset.k!=null)gut(e.target.dataset.k)};
app.onkeydown=e=>{const a=e.target;if(!a.classList.contains('ed')||a.dataset.k==null)return;if(e.key=='Tab'){e.preventDefault();a.setRangeText('  ',a.selectionStart,a.selectionEnd,'end');gut(a.dataset.k)}if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();doRun(a.dataset.k,false)}};
app.onclick=e=>{const d=e.target.dataset;if(d.wr!=null)doRun(d.wr,false);if(d.ws!=null)doRun(d.ws,true);
if(d.wm!=null){const w=W[d.wm],m=$('#wmx'+d.wm);m.hidden=false;m.innerHTML=(w.st?wtHTML('wm'+d.wm,w.m,w.st):'<pre>'+esc(w.m)+'</pre>')+`<div class="ex"><b>Why:</b> ${esc(w.why)}</div>`}
if(d.fc!=null)chk(+d.fc)}}
function doRun(k,sub){const w=W[k],src=$('#w'+k).value,o=$('#wo'+k);o.hidden=false;let s='';
if(!sub){if(!w.tc){o.textContent='This one cannot run in a browser. Use Submit to check its structure.';return}const r=runC(src,$('#in'+k).value);o.textContent=r.o+(r.e?'\n'+r.e:'');return}
if(w.tc)w.tc.forEach(([i,x],j)=>{const r=runC(src,i),ok=!r.e&&nz(r.o)==nz(x);s+=(ok?'PASS':'FAIL')+' test '+(j+1)+(ok?'':'  expected: '+nz(x)+'  got: '+(r.e||nz(r.o)))+'\n'});
else{const c=src.replace(/\/\/.*|\/\*[\s\S]*?\*\//g,'');w.pat.forEach(([l,re])=>{s+=(re.test(c)?'PASS  ':'MISSING  ')+l+'\n'})}
o.textContent=s+(/FAIL|MISSING/.test(s)?'\nNot there yet. Fix and resubmit, or open the model answer.':'\nAll checks passed. Compare with the model answer.')}
function chk(k){const f=F[k];let all=1;[...document.querySelectorAll('#f'+k+' input')].forEach((x,j)=>{const ok=f.b[j].map(nrm).includes(nrm(x.value));x.style.borderColor=ok?'var(--ok)':'var(--bad)';if(!ok)all=0});
$('#fr'+k).innerHTML=(all?'<span class="out">All correct.</span>':'Answers: '+f.b.map(a=>'<code>'+esc(a[0])+'</code>').join(', '))+'<div class="ex">'+f.why+'</div>'}
const WT={};
const rng=s=>{const[a,b]=String(s).split('-').map(Number);return[a,b||a]};
function wtHTML(id,code,st){WT[id]={st,i:-1,tm:0};return `<div class="wt" id="${id}"><div class="ide"><pre class="wc">${code.split('\n').map((l,i)=>`<span class="ln" data-l="${i+1}">${esc(l)||' '}</span>`).join('')}</pre></div><div class="row"><button data-wp="${id}">Prev</button><button data-wn="${id}">Next</button><button data-wa="${id}">Auto-play</button></div><div class="ex" id="${id}t">Press Next, or click any line, to step through.</div></div>`}
function wtStep(id,i){const w=WT[id],el=document.getElementById(id);w.i=Math.max(0,Math.min(w.st.length-1,i));el.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));const[a,b]=rng(w.st[w.i][0]);for(let l=a;l<=b;l++){const n=el.querySelector('.ln[data-l="'+l+'"]');if(n)n.classList.add('hl')}document.getElementById(id+'t').innerHTML='<b>Step '+(w.i+1)+'/'+w.st.length+'</b> · '+esc(w.st[w.i][1])}
document.addEventListener('click',e=>{const t=e.target,d=t.dataset||{};
if(d.wp)wtStep(d.wp,WT[d.wp].i-1);else if(d.wn)wtStep(d.wn,WT[d.wn].i+1);
else if(d.wa){const w=WT[d.wa];if(w.tm){clearInterval(w.tm);w.tm=0}else{wtStep(d.wa,w.i+1);w.tm=setInterval(()=>{if(w.i>=w.st.length-1){clearInterval(w.tm);w.tm=0;return}wtStep(d.wa,w.i+1)},2500)}}
else if(t.classList&&t.classList.contains('ln')){const id=t.closest('.wt').id,l=+d.l,k=WT[id].st.findIndex(s=>{const[a,b]=rng(s[0]);return l>=a&&l<=b});if(k>=0)wtStep(id,k)}});

{ch:5,t:'Lost update with threads',src:'Ch5 · race condition',type:'Analyse',q:'Two threads each run work(). Is the final counter always 200000? Fix it.',code:R`int counter = 0;
void *work(void *a) {
  for (int i = 0; i < 100000; i++)
    counter++;
  return NULL;
}
/* main creates 2 threads on work, joins both, prints counter */`,ans:'No: anywhere from 100000 to 200000. Fix: lock a mutex around counter++.',why:'counter++ is load, add, store. Two threads can load the same value and one update is lost. Mutex gives mutual exclusion.',st:[['1','Shared global variable.'],['3-4','counter++ is three steps: load, add, store.'],['4','Two threads can both load 5 and both store 6: lost update.'],['3-4','Fix: pthread_mutex_lock before and pthread_mutex_unlock after counter++.']]},
{ch:6,t:'Trace Round Robin code',src:'Ch6 · RR · tutorial calc',type:'Trace and run',run:1,q:'Bursts 5 and 3, quantum 2, both arrive at 0. What does it print? Run it to verify.',code:R`#include <stdio.h>
int main() {
  int b[2] = {5, 3}, r[2] = {5, 3};
  int q = 2, t = 0, left = 2, tot = 0, i, run;
  while (left > 0)
    for (i = 0; i < 2; i++)
      if (r[i] > 0) {
        run = r[i] < q ? r[i] : q;
        t += run; r[i] -= run;
        if (r[i] == 0) { tot += t - b[i]; left--; }
      }
  printf("Total wait = %d\n", tot);
  return 0;
}`,ans:'Total wait = 7',why:'Gantt: P1 0-2, P2 2-4, P1 4-6, P2 6-7, P1 7-8. P2 waits 7-3=4, P1 waits 8-5=3.',st:[['3-4','Setup: remaining time = burst, t = clock.'],['5-7','Pass 1: P1 runs 2 (t=2, r=3), P2 runs 2 (t=4, r=1).'],['8-9','Each slice is min(remaining, quantum).'],['5-7','Pass 2: P1 runs 2 (t=6, r=1), P2 runs 1 (t=7, done).'],['10','P2 done: wait = 7 - 3 = 4.'],['5-7','Pass 3: P1 runs 1 (t=8, done).'],['10','P1 wait = 8 - 5 = 3. Total 7.'],['12','Prints Total wait = 7.']]},
{ch:5,t:'Find the deadlock',src:'Ch5 · bounded buffer',type:'Analyse',q:'This producer is wrong. What is the bug and what deadlock can it cause?',code:R`/* Producer: mutex=1, empty=N, full=0 */
while (1) {
  item = produce();
  wait(mutex);
  wait(empty);
  buffer[in] = item; in = (in + 1) % N;
  signal(mutex);
  signal(full);
}`,ans:'wait(mutex) is before wait(empty). If the buffer is full the producer sleeps on empty while holding mutex, so the consumer can never enter to free a slot: deadlock.',why:'Always wait on the counting semaphore first, then the mutex.',st:[['4','Producer takes the lock first.'],['5','Buffer full: it blocks here, still holding mutex.'],['4','Consumer needs mutex to remove an item. It blocks too: deadlock.'],['4-5','Fix: swap the two lines (empty first, then mutex).']]},
{ch:3,t:'Read find_path from myshell',src:'Assignment 1 · myshell.c',type:'Analyse',q:'For "ls" with PATH=/bin:/usr/bin, which strings are tried? When does it return NULL and what should the shell do?',code:R`char* find_path(char* cmd) {
  char* path_copy = strdup(getenv("PATH"));
  char* dir = strtok(path_copy, ":");
  while (dir != NULL) {
    snprintf(full, sizeof(full), "%s/%s", dir, cmd);
    if (stat(full, &buf) == 0) { free(path_copy); return full; }
    dir = strtok(NULL, ":");
  }
  free(path_copy);
  return NULL;
}`,ans:'Tries /bin/ls then /usr/bin/ls, returns the first where stat succeeds. NULL if none exist: print an error and do not call execv (child exits).',why:'strtok modifies its string, so a copy of PATH is used. stat() checks that the file exists.',st:[['2','Copy PATH because strtok destroys the string.'],['3','First directory: /bin.'],['5','Build /bin/ls.'],['6','stat succeeds: return it. Otherwise continue.'],['7','Next directory: /usr/bin.'],['9-10','No directory had it: return NULL.']]}
);

{ch:3,t:'Mini shell loop',q:'Loop: print "> ", read a line with fgets, stop on "exit", split into words with strtok, run with execvp in a child, parent waits.',code:R`#include <stdio.h>
#include <string.h>
#include <unistd.h>
#include <sys/wait.h>
int main(void) {
  // your code
  return 0;
}`,pat:[['loop',/while|for\s*\(\s*;;/],['fgets',/fgets\s*\(/],['exit check',/strcmp[^;]*exit/],['strtok',/strtok\s*\(/],['fork',/fork\s*\(/],['execvp',/execvp\s*\(/],['wait',/wait\s*\(/]],m:R`char line[256], *args[16];
while (1) {
  printf("> ");
  if (!fgets(line, sizeof line, stdin)) break;
  line[strcspn(line, "\n")] = 0;
  if (strcmp(line, "exit") == 0) break;
  int n = 0;
  for (char *t = strtok(line, " "); t; t = strtok(NULL, " ")) args[n++] = t;
  args[n] = NULL;
  if (fork() == 0) { execvp(args[0], args); perror("exec"); _exit(1); }
  wait(NULL);
}`,why:'The core of Assignment 1: Parse, fork, exec, wait.',st:[['1','Buffers for the line and the argument list.'],['3-4','Prompt and read; stop on end of input.'],['5-6','Strip newline, exit on "exit".'],['7-9','Split into words; args must end with NULL.'],['10','Child becomes the command; _exit if exec fails.'],['11','Parent waits then loops again.']]}
