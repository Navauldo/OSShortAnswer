D.push(...[[1, "m", "According to the text, which of the following best describes the operating system as a \"resource allocator\"?", "It manages all resources and decides between conflicting requests for efficient and fair resource use.\n\n<span class=\"mu\">Why: </span>The slides explicitly define the OS as a resource allocator that \"manages all resources\" and \"decides between conflicting requests for efficient and fair resource use.\""], [1, "m", "Which of the following is NOT one of the four main components of a computer system?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) Hardware<br>B) Operating System<br>C) Compiler<br>D) Users</div>", "Compiler\n\n<span class=\"mu\">Why: </span>The four components listed in the slides are Hardware, Operating System, Application programs, and Users. A compiler is a type of application program/system program, not a top-level component."], [1, "m", "What is the primary function of the bootstrap program during computer startup?", "To initialize all aspects of the system and load the operating system kernel.\n\n<span class=\"mu\">Why: </span>The slides state that the bootstrap program (stored in ROM/EPROM) \"initializes all aspects of system\" and \"loads operating system kernel and starts execution.\""], [1, "m", "What is a \"trap\" or \"exception\" in the context of interrupts?", "A software-generated interrupt caused by an error or a user request.\n\n<span class=\"mu\">Why: </span>The slides define a trap or exception specifically as a \"software-generated interrupt caused either by an error or a user request.\""], [1, "m", "In I/O structure, what does the device-status table contain?", "An entry for each I/O device indicating its type, address, and state.\n\n<span class=\"mu\">Why: </span>The slides state: \"Device-status table contains entry for each I/O device indicating its type, address, and state.\""], [1, "m", "According to standard computer storage definitions in the text, how many bytes are in a Gigabyte (GB)?", "1,024³ bytes\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"a gigabyte, or GB, is 1,024³ bytes\"."], [1, "m", "Which characteristic best describes \"main memory\"?", "Random access and typically volatile.\n\n<span class=\"mu\">Why: </span>The slides define main memory as the \"only large storage media that the CPU can access directly,\" noting it is \"Random access\" and \"Typically volatile.\""], [1, "m", "What is the fundamental principle of \"caching\"?", "Copying information into faster storage temporarily for quick access.\n\n<span class=\"mu\">Why: </span>The slides define caching as \"copying information into faster storage system\" temporarily, where the faster storage is checked first."], [1, "m", "What is the main advantage of Direct Memory Access (DMA)?", "It transfers blocks of data directly to main memory without CPU intervention, generating only one interrupt per block.\n\n<span class=\"mu\">Why: </span>The slides state DMA is used for high-speed I/O devices and \"transfers blocks of data from buffer storage directly to main memory without CPU intervention,\" generating \"only one interrupt... per block, rather than the one interrupt per byte.\""], [1, "m", "In Symmetric Multiprocessing (SMP), how do the processors operate?", "Each processor performs all tasks and shares the workload.\n\n<span class=\"mu\">Why: </span>The slides define Symmetric Multiprocessing as a system where \"each processor performs all tasks.\""], [1, "m", "What characterizes \"asymmetric clustering\"?", "One machine is in hot-standby mode while the other runs the application.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Asymmetric clustering has one machine in hot-standby mode.\""], [1, "m", "What is the primary goal of multiprogramming?", "To ensure the CPU always has a job to execute, maximizing efficiency.\n\n<span class=\"mu\">Why: </span>The slides state multiprogramming \"organizes jobs (code and data) so CPU always has one to execute,\" because a single user cannot keep CPU and I/O busy at all times."], [1, "m", "In a timesharing (multitasking) system, what should the response time be?", "Less than 1 second.\n\n<span class=\"mu\">Why: </span>The slides explicitly state for timesharing: \"Response time should be &lt; 1 second.\""], [1, "m", "What is the purpose of the \"mode bit\" in dual-mode operation?", "To determine if the system is running user code or kernel code.\n\n<span class=\"mu\">Why: </span>The slides state the mode bit \"provides ability to distinguish when system is running user code or kernel code.\""], [1, "m", "Why does the operating system set a timer before scheduling a process?", "To prevent an infinite loop or a process from hogging resources.\n\n<span class=\"mu\">Why: </span>The slides state the timer is used \"to prevent infinite loop / process hogging resources.\""], [1, "m", "How does the text distinguish between a \"program\" and a \"process\"?", "A program is a passive entity stored on disk, while a process is an active entity in execution.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Program is passive entity stored on disk (executable file), process is active\" and \"A process is a program in execution.\""], [1, "m", "Which of the following is an activity of \"Process Management\"?", "Creating and deleting both user and system processes.\n\n<span class=\"mu\">Why: </span>The slides list \"Creating and deleting both user and system processes\" as a primary process management activity."], [1, "m", "What is a key activity of \"Memory Management\"?", "Keeping track of which parts of memory are currently being used and by whom.\n\n<span class=\"mu\">Why: </span>The slides list \"Keeping track of which parts of memory are currently being used and by whom\" under Memory Management activities."], [1, "m", "In the I/O subsystem, what does \"spooling\" refer to?", "The overlapping of output of one job with input of other jobs.\n\n<span class=\"mu\">Why: </span>The slides define spooling as \"the overlapping of output of one job with input of other jobs.\""], [1, "m", "What is the difference between \"protection\" and \"security\" in an OS?", "Protection controls access of processes/users to resources; security defends the system against internal and external attacks.\n\n<span class=\"mu\">Why: </span>The slides define Protection as \"any mechanism for controlling access of processes or users to resources\" and Security as \"defense of the system against internal and external attacks.\""], [1, "m", "What is the search performance of a <i>balanced</i> binary search tree, as mentioned in the kernel data structures section?", "O(lg n)\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Balanced binary search tree is O(lg n).\""], [1, "m", "Which of the following provides features between systems across a network to create the \"illusion of a single system\"?", "Network Operating System (NOS)\n\n<span class=\"mu\">Why: </span>The slides state that a \"Network Operating System provides features between systems across a network,\" creating the \"Illusion of a single system.\""], [1, "m", "In a Peer-to-Peer (P2P) computing model, how are nodes treated?", "As peers that may each act as a client, a server, or both.\n\n<span class=\"mu\">Why: </span>The slides state: \"P2P does not distinguish clients and servers. Instead all nodes are considered peers. May each act as client, server or both.\""], [1, "m", "What is the role of a Virtual Machine Manager (VMM) in virtualization?", "To provide virtualization services, allowing guest OSes to run natively compiled on a host.\n\n<span class=\"mu\">Why: </span>The slides state: \"VMM (virtual machine Manager) provides virtualization services,\" allowing guest OSes (also natively compiled) to run."], [1, "m", "Which cloud computing model provides a \"software stack ready for application use via the Internet (i.e., a database server)\"?", "Platform as a Service (PaaS)\n\n<span class=\"mu\">Why: </span>The slides define Platform as a Service (PaaS) as a \"software stack ready for application use via the Internet (i.e., a database server).\""], [2, "m", "Which of the following is an Operating System service primarily designed to ensure the efficient operation of the system itself via resource sharing?", "Resource allocation\n\n<span class=\"mu\">Why: </span>The slides explicitly state that \"Resource allocation\" is a function that exists for \"ensuring the efficient operation of the system itself via resource sharing\" (e.g., CPU cycles, main memory, I/O devices)."], [2, "m", "The graphical user interface (GUI) desktop metaphor was originally invented at:", "Xerox PARC\n\n<span class=\"mu\">Why: </span>The slides explicitly state under the GUI section: \"Invented at Xerox PARC\"."], [2, "m", "What is the primary role of a system call?", "To act as the programming interface to the services provided by the OS\n\n<span class=\"mu\">Why: </span>The slides define a system call as the \"Programming interface to the services provided by the OS.\""], [2, "m", "Which of the following is NOT one of the three most common APIs mentioned for accessing system calls?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) Win32 API<br>B) POSIX API<br>C) Java API<br>D) POSIX Threads (Pthreads) API</div>", "POSIX Threads (Pthreads) API\n\n<span class=\"mu\">Why: </span>The slides explicitly list the \"three most common APIs\" as \"Win32 API for Windows, POSIX API for POSIX-based systems... and Java API for the Java virtual machine.\" Pthreads is a thread library (covered in Chapter 4), not listed here as one of the top 3 general system call APIs."], [2, "m", "In system call implementation, how does the system-call interface typically determine which intended system call to invoke in the OS kernel?", "By using a table indexed according to a number associated with each system call\n\n<span class=\"mu\">Why: </span>The slides state: \"Typically, a number associated with each system call. System-call interface maintains a table indexed according to these numbers.\""], [2, "m", "Which method of system call parameter passing is explicitly noted as being taken by Linux and Solaris?", "Parameters stored in a block or table in memory, with the address passed in a register\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Parameters stored in a block, or table, in memory, and address of block passed as a parameter in a register. This approach taken by Linux and Solaris.\""], [2, "m", "Which category of system calls includes operations like \"create file, delete file, open, close file, read, write\"?", "File management\n\n<span class=\"mu\">Why: </span>The slides explicitly list all of these operations under the \"File management\" category of system calls."], [2, "m", "In the MS-DOS example provided in the slides, what happens when a program is run?", "The program is loaded into memory, overwriting all but the kernel, in a single memory space\n\n<span class=\"mu\">Why: </span>The slides describe MS-DOS as having a \"Single memory space\" where it \"Loads program into memory, overwriting all but the kernel.\""], [2, "m", "In the FreeBSD example, which system call is executed by the shell to create a new process?", "<code>fork()</code>\n\n<span class=\"mu\">Why: </span>The slides state: \"Shell executes <code>fork()</code> system call to create process.\""], [2, "m", "System programs that launch at boot time and provide facilities like disk checking, process scheduling, and error logging are known as:", "Background services (or services, subsystems, daemons)\n\n<span class=\"mu\">Why: </span>The slides define \"Background Services\" as programs that \"Launch at boot time... Provide facilities like disk checking, process scheduling, error logging\" and are \"Known as services, subsystems, daemons.\""], [2, "m", "What is the \"very important principle\" in OS design that allows maximum flexibility if policy decisions are to be changed later?", "Separation of Policy (what will be done) and Mechanism (how to do it)\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"The separation of policy from mechanism is a very important principle, it allows maximum flexibility if policy decisions are to be changed later.\""], [2, "m", "What is a major trade-off of implementing an operating system in a high-level language rather than assembly?", "It is easier to port to other hardware but slower\n\n<span class=\"mu\">Why: </span>The slides state: \"More high-level language easier to port to other hardware. But slower.\""], [2, "m", "In a Layered Approach to OS structure, which layer represents the hardware and which represents the user interface?", "Layer 0 is hardware; Layer N is user interface\n\n<span class=\"mu\">Why: </span>The slides define the layered approach: \"The bottom layer (layer 0), is the hardware; the highest (layer N) is the user interface.\""], [2, "m", "Which of the following is a stated <i>detriment</i> of a Microkernel system structure?", "Performance overhead of user space to kernel space communication\n\n<span class=\"mu\">Why: </span>The slides explicitly list \"Performance overhead of user space to kernel space communication\" under the \"Detriments\" of a microkernel."], [2, "m", "How do loadable kernel modules (used in Linux, Solaris) compare to the layered approach?", "They are similar to layers but more flexible, using an object-oriented approach\n\n<span class=\"mu\">Why: </span>The slides state that modules are \"Overall, similar to layers but with more flexible\" and \"Uses object-oriented approach\" where each core component is separate and loadable as needed."], [2, "m", "The Mac OS X kernel (Darwin) is an example of a hybrid system. What does its kernel consist of?", "A Mach microkernel, BSD Unix parts, I/O kit, and dynamically loadable modules (kernel extensions)\n\n<span class=\"mu\">Why: </span>The slides explicitly describe the Mac OS X hybrid structure: \"Below is kernel consisting of Mach microkernel and BSD Unix parts, plus I/O kit and dynamically loadable modules (called kernel extensions).\""], [2, "m", "Which virtual machine is explicitly mentioned as part of the Android runtime environment, translating Java bytecode to run on the device?", "Dalvik virtual machine\n\n<span class=\"mu\">Why: </span>The slides state: \"Runtime environment includes core set of libraries and Dalvik virtual machine... Java class files compiled to Java bytecode then translated to executable that runs in Dalvik VM.\""], [2, "m", "What is the difference between a \"core dump\" and a \"crash dump\" in OS debugging?", "A core dump captures the memory of a failed application process; a crash dump contains kernel memory from an OS failure.\n\n<span class=\"mu\">Why: </span>The slides explicitly distinguish them: \"Failure of an application can generate core dump file capturing memory of the process. Operating system failure can generate crash dump file containing kernel memory.\""], [2, "m", "### **Question the slides, what is DTrace?", "A tool that allows live instrumentation on production systems, where probes fire when code is executed\n\n<span class=\"mu\">Why: </span>The slides state: \"DTrace tool in Solaris, FreeBSD, Mac OS X allows live instrumentation on production systems. Probes fire when code is executed within a provider, capturing state data...\""], [2, "m", "What is the purpose of the SYSGEN program in Operating System Generation?", "To obtain information concerning the specific configuration of the hardware system to build a system-specific compiled kernel\n\n<span class=\"mu\">Why: </span>The slides state: \"SYSGEN program obtains information concerning the specific configuration of the hardware system. Used to build system-specific compiled kernel or system-tuned.\""], [2, "m", "During system boot, where is the initial bootstrap loader typically stored?", "In ROM or EEPROM (firmware)\n\n<span class=\"mu\">Why: </span>The slides state: \"Small piece of code – bootstrap loader, stored in ROM or EEPROM locates the kernel, loads it into memory, and starts it.\""], [2, "m", "Which of the following is a common bootstrap loader that allows selection of a kernel from multiple disks, versions, or kernel options?", "GRUB\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Common bootstrap loader, GRUB, allows selection of kernel from multiple disks, versions, kernel options.\""], [2, "m", "Which of the following is NOT listed as a category of System Programs in the slides?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) File manipulation<br>B) Status information<br>C) Hardware circuit design<br>D) Programming language support</div>", "Hardware circuit design\n\n<span class=\"mu\">Why: </span>The slides list File manipulation, Status information, File modification, Programming language support, Program loading/execution, Communications, Background services, and Application programs. \"Hardware circuit design\" is an engineering task, not an OS system program."], [2, "m", "According to the slides, what does Kernighan’s Law state in the context of OS debugging?", "\"Debugging is twice as hard as writing the code in the first place. Therefore, if you write the code as cleverly as possible, you are, by definition, not smart enough to debug it.\"\n\n<span class=\"mu\">Why: </span>The slides explicitly quote Kernighan’s Law verbatim: “Debugging is twice as hard as writing the code in the first place. Therefore, if you write the code as cleverly as possible, you are, by definition, not smart enough to debug it.”"], [3, "m", "What is the fundamental difference between a program and a process?", "A program is a passive entity stored on disk, while a process is an active entity in execution.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Program is passive entity stored on disk (executable file), process is active.\""], [3, "m", "Which process state indicates that the process is waiting to be assigned to a processor?", "Ready\n\n<span class=\"mu\">Why: </span>The slides define the \"ready\" state as: \"The process is waiting to be assigned to a processor.\""], [3, "m", "Which of the following is NOT typically stored in a Process Control Block (PCB)?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) Program counter<br>B) CPU registers<br>C) The complete source code of the program<br>D) I/O status information</div>", "The complete source code of the program\n\n<span class=\"mu\">Why: </span>The PCB contains metadata <i>about</i> the process (state, PC, registers, scheduling info, memory info, accounting info, I/O status). The actual program code (text section) is stored in the process's memory space, not inside the PCB itself."], [3, "m", "Which scheduler is invoked frequently (in milliseconds) and must be fast?", "Short-term scheduler\n\n<span class=\"mu\">Why: </span>The slides state the short-term scheduler (or CPU scheduler) \"is invoked frequently (milliseconds) ⇒ (must be fast).\""], [3, "m", "How does the text describe an I/O-bound process?", "It spends more time doing I/O than computations, having many short CPU bursts.\n\n<span class=\"mu\">Why: </span>The slides explicitly define an I/O-bound process as one that \"spends more time doing I/O than computations, many short CPU bursts.\""], [3, "m", "What is the primary function of the medium-term scheduler?", "To remove a process from memory (and store it on disk) to decrease the degree of multiprogramming (swapping).\n\n<span class=\"mu\">Why: </span>The slides state the medium-term scheduler can be added \"if degree of multiprogramming needs to decrease,\" and it works by removing a process from memory, storing it on disk, and bringing it back later (swapping)."], [3, "m", "What does a context switch involve?", "Saving the state of the old process and loading the saved state for the new process.\n\n<span class=\"mu\">Why: </span>The slides define a context switch as: \"When CPU switches to another process, the system must save the state of the old process and load the saved state for the new process.\""], [3, "m", "In UNIX, which system call is used to create a new process?", "<code>fork()</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"<code>fork()</code> system call creates new process.\""], [3, "m", "What is the purpose of the <code>exec()</code> system call after a <code>fork()</code>?", "To replace the process's memory space with a new program.\n\n<span class=\"mu\">Why: </span>The slides state: \"<code>exec()</code> system call used after a <code>fork()</code> to replace the process’ memory space with a new program.\""], [3, "m", "What is a \"zombie\" process?", "A terminated process whose parent has not yet invoked the <code>wait()</code> system call.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"If no parent waiting (did not invoke <code>wait()</code>) process is a zombie.\""], [3, "m", "What is an \"orphan\" process?", "A process whose parent has terminated without invoking <code>wait()</code>.\n\n<span class=\"mu\">Why: </span>The slides state: \"If parent terminated without invoking wait, process is an orphan.\""], [3, "m", "What is \"cascading termination\"?", "When a parent process terminates, the operating system terminates all of its children (and grandchildren, etc.).\n\n<span class=\"mu\">Why: </span>The slides define cascading termination as: \"All children, grandchildren, etc. are terminated. The termination is initiated by the operating system\" when a parent terminates and the OS does not allow orphans."], [3, "m", "What are the two primary models of Interprocess Communication (IPC)?", "Shared memory and message passing.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Two models of IPC: Shared memory, Message passing.\""], [3, "m", "### **Question it primarily responsible for ensuring that processes do not concurrently access the same memory locations in a conflicting way?", "The user processes themselves (requiring synchronization mechanisms).\n\n<span class=\"mu\">Why: </span>The slides state for shared memory: \"The communication is under the control of the users processes not the operating system. Major issues is to provide mechanism that will allow the user processes to synchronize their actions...\""], [3, "m", "Which of the following is a property of <i>direct</i> communication in message passing?", "Processes must name each other explicitly (e.g., <code>send(P, message)</code>).\n\n<span class=\"mu\">Why: </span>The slides state for direct communication: \"Processes must name each other explicitly: <code>send(P, message)</code>... <code>receive(Q, message)</code>.\""], [3, "m", "In <i>indirect</i> communication, messages are sent to and received from:", "Mailboxes (or ports).\n\n<span class=\"mu\">Why: </span>The slides state: \"Messages are directed and received from mailboxes (also referred to as ports).\""], [3, "m", "What is a \"rendezvous\" in the context of message passing synchronization?", "When both send and receive operations are blocking (synchronous).\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"If both send and receive are blocking, we have a rendezvous.\""], [3, "m", "In a message passing system with <i>zero capacity</i> buffering, what must the sender do?", "The sender must wait for the receiver to be ready (rendezvous), as no messages are queued.\n\n<span class=\"mu\">Why: </span>The slides define zero capacity as: \"no messages are queued on a link. Sender must wait for receiver (rendezvous).\""], [3, "m", "In POSIX shared memory, which function is used to create or open a shared memory segment?", "<code>shm_open()</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly show the POSIX shared memory example: <code>shm_fd = shm_open(name, O_CREAT | O_RDWR, 0666);</code>"], [3, "m", "Which three system calls are needed for message transfer in the Mach IPC system?", "<code>msg_send()</code>, <code>msg_receive()</code>, <code>msg_rpc()</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state for Mach: \"Only three system calls needed for message transfer: <code>msg_send()</code>, <code>msg_receive()</code>, <code>msg_rpc()</code>.\""], [3, "m", "How does Windows implement local procedure calls (LPC) for IPC?", "By using ports (like mailboxes) to establish and maintain communication channels between client and server.\n\n<span class=\"mu\">Why: </span>The slides state Windows LPC \"Uses ports (like mailboxes) to establish and maintain communication channels.\""], [3, "m", "What is a socket in the context of client-server communication?", "An endpoint for communication, defined as the concatenation of an IP address and a port number.\n\n<span class=\"mu\">Why: </span>The slides define a socket as: \"an endpoint for communication. Concatenation of IP address and port...\""], [3, "m", "In Remote Procedure Calls (RPC), what is the role of a \"stub\"?", "To act as a client-side or server-side proxy that marshals/unmarshals parameters for the procedure call.\n\n<span class=\"mu\">Why: </span>The slides state: \"Stubs – client-side proxy for the actual procedure on the server. The client-side stub locates the server and marshalls the parameters. The server-side stub receives this message, unpacks the marshalled parameters...\""], [3, "m", "What is a key characteristic of an <i>ordinary pipe</i> in IPC?", "It requires a parent-child relationship between the communicating processes and is unidirectional.\n\n<span class=\"mu\">Why: </span>The slides state ordinary pipes are \"unidirectional\" and \"Require parent-child relationship between communicating processes.\""], [3, "m", "How do <i>named pipes</i> differ from ordinary pipes?", "Named pipes allow bidirectional communication and do not require a parent-child relationship.\n\n<span class=\"mu\">Why: </span>The slides state named pipes are \"more powerful than ordinary pipes,\" \"Communication is bidirectional,\" and \"No parent-child relationship is necessary.\""], [4, "m", "Which benefit of multithreading is described as being \"cheaper than process creation\" and having lower overhead for thread switching than context switching?", "Economy\n\n<span class=\"mu\">Why: </span>The slides explicitly define \"Economy\" as being cheaper than process creation, with thread switching having lower overhead than context switching."], [4, "m", "In multicore programming, what is \"task parallelism\"?", "Distributing threads across cores, with each thread performing a unique operation.\n\n<span class=\"mu\">Why: </span>The slides define task parallelism as \"distributing threads across cores, each thread performing unique operation.\""], [4, "m", "According to Amdahl’s Law, what has a disproportionate effect on the performance gained by adding additional cores to an application?", "The serial portion of the application.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Serial portion of an application has disproportionate effect on performance gained by adding additional cores.\""], [4, "m", "Which of the following best describes \"kernel threads\"?", "Threads that are supported directly by the operating system kernel.\n\n<span class=\"mu\">Why: </span>The slides define kernel threads as being \"Supported by the Kernel,\" with examples including Windows, Solaris, Linux, Tru64 UNIX, and Mac OS X."], [4, "m", "What is a major drawback of the \"Many-to-One\" multithreading model?", "If one thread blocks, all threads block, and multiple threads cannot run in parallel on a multicore system.\n\n<span class=\"mu\">Why: </span>The slides state for Many-to-One: \"One thread blocking causes all to block. Multiple threads may not run in parallel on multicore system because only one may be in kernel at a time.\""], [4, "m", "Which of the following operating systems are explicitly listed as examples of the \"One-to-One\" multithreading model?", "Windows, Linux, and Solaris 9 and later\n\n<span class=\"mu\">Why: </span>The slides explicitly list \"Windows, Linux, Solaris 9 and later\" as examples of the One-to-One model."], [4, "m", "What is a key characteristic of the \"Many-to-Many\" multithreading model?", "It allows the operating system to create a sufficient number of kernel threads to handle the user threads.\n\n<span class=\"mu\">Why: </span>The slides state that the Many-to-Many model \"Allows the operating system to create a sufficient number of kernel threads.\""], [4, "m", "The \"Two-level\" multithreading model is similar to the Many-to-Many model, but with what specific addition?", "It allows a user thread to be bound to a kernel thread.\n\n<span class=\"mu\">Why: </span>The slides state: \"Two-level Model: Similar to M:M, except that it allows a user thread to be bound to kernel thread.\""], [4, "m", "Pthreads is a POSIX standard API for thread creation and synchronization. What is its official IEEE designation?", "IEEE 1003.1c\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"A POSIX standard (IEEE 1003.1c) API for thread creation and synchronization.\""], [4, "m", "In Java, threads may be created by which of the following methods?", "Extending the <code>Thread</code> class or implementing the <code>Runnable</code> interface.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Java threads may be created by: Extending Thread class, Implementing the Runnable interface.\""], [4, "m", "What is a primary advantage of using \"Thread Pools\" in implicit threading?", "It is usually slightly faster to service a request with an existing thread than to create a new one.\n\n<span class=\"mu\">Why: </span>The slides list as an advantage: \"Usually slightly faster to service a request with an existing thread than create a new thread.\""], [4, "m", "In OpenMP, which compiler directive is used to identify a parallel region (a block of code that can run in parallel)?", "<code>#pragma omp parallel</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly show <code>#pragma omp parallel</code> as the directive to \"Identify parallel regions – blocks of code that can run in parallel.\""], [4, "m", "### **Question to identify parallel sections in Grand Central Dispatch (GCD)?", "Blocks enclosed in <code>^{ }</code>\n\n<span class=\"mu\">Why: </span>The slides state for Grand Central Dispatch: \"Block is in <code>^{ }</code> - <code>^{ printf(\"I am a block\"); }</code>\""], [4, "m", "Grand Central Dispatch utilizes two primary types of dispatch queues. What are they?", "Serial and concurrent\n\n<span class=\"mu\">Why: </span>The slides explicitly list \"Two types of dispatch queues: serial... [and] concurrent.\""], [4, "m", "When discussing the semantics of the <code>fork()</code> system call in a multithreaded environment, what is the primary ambiguity?", "Whether <code>fork()</code> duplicates only the calling thread or all threads.\n\n<span class=\"mu\">Why: </span>The slides explicitly pose the question under Threading Issues: \"Does <code>fork()</code> duplicate only the calling thread or all threads?\""], [4, "m", "In a multithreaded process, which of the following is NOT listed as a valid option for where a signal should be delivered?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) To the thread to which the signal applies.<br>B) To every thread in the process.<br>C) To certain threads in the process.<br>D) To the hardware interrupt controller exclusively, bypassing the OS.</div>", "To the hardware interrupt controller exclusively, bypassing the OS.\n\n<span class=\"mu\">Why: </span>The slides list four valid delivery options: to the applicable thread, to every thread, to certain threads, or assigning a specific thread to receive all signals. Bypassing the OS to the hardware controller is not a valid software signal delivery option."], [4, "m", "What characterizes \"asynchronous cancellation\" in thread cancellation?", "It terminates the target thread immediately.\n\n<span class=\"mu\">Why: </span>The slides define asynchronous cancellation as terminating \"the target thread immediately.\""], [4, "m", "In deferred cancellation, when does the actual cancellation occur?", "When the thread reaches a \"cancellation point\" (e.g., <code>pthread_testcancel()</code>).\n\n<span class=\"mu\">Why: </span>The slides state for deferred cancellation: \"Cancellation only occurs when thread reaches cancellation point. I.e. <code>pthread_testcancel()</code>.\""], [4, "m", "How does Thread-Local Storage (TLS) differ from standard local variables?", "TLS is unique to each thread and visible across function invocations, unlike local variables.\n\n<span class=\"mu\">Why: </span>The slides state: \"TLS visible across function invocations... TLS is unique to each thread.\" This contrasts with local variables, which are visible only during a single function invocation."], [4, "m", "What mechanism do \"scheduler activations\" use to allow the kernel to communicate with the user-level thread library to maintain the correct number of kernel threads?", "Upcalls\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Scheduler activations provide upcalls - a communication mechanism from the kernel to the upcall handler in the thread library.\""], [4, "m", "In the Windows threading model, where is the Thread Environment Block (TEB) located?", "In user space\n\n<span class=\"mu\">Why: </span>The slides explicitly state that the TEB (thread environment block), which contains the thread id, user-mode stack, and thread-local storage, is located \"in user space.\""], [4, "m", "In Windows, the register set, stacks, and private storage area of a thread are collectively known as the thread's:", "<code>exec()</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"The register set, stacks, and private storage area are known as the context of the threads.\""], [4, "m", "In Linux, the <code>clone()</code> system call allows a child task to share the address space of the parent task. What data structure points to the process data structures (shared or unique)?", "<code>struct task_struct</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"<code>struct task_struct</code> points to process data structures (shared or unique).\""], [4, "m", "How do the slides distinguish between \"parallelism\" and \"concurrency\"?", "Parallelism implies a system can perform more than one task simultaneously, while concurrency supports more than one task making progress.\n\n<span class=\"mu\">Why: </span>The slides explicitly define: \"Parallelism implies a system can perform more than one task simultaneously. Concurrency supports more than one task making progress.\""], [4, "m", "Linux refers to threads as \"tasks\" rather than threads. Which system call is used for thread creation in Linux?", "<code>clone()</code>\n\n<span class=\"mu\">Why: </span>Thread creation is done through the clone() system call. fork() creates a new process, exec() replaces the process image, and pthread_create() is a library function built on top of it."], [5, "m", "What is a \"race condition\"?", "When multiple processes access and manipulate shared data concurrently, and the final outcome depends on the particular order in which the access takes place.\n\n<span class=\"mu\">Why: </span>The slides define a race condition in the context of the counter++ and counter-- example, where interleaved execution leads to an incorrect final value depending on the order of operations."], [5, "m", "Which of the following is NOT one of the three requirements for a solution to the critical-section problem?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) Mutual Exclusion<br>B) Bounded Execution<br>C) Progress<br>D) Bounded Waiting</div>", "Bounded Execution\n\n<span class=\"mu\">Why: </span>The slides explicitly list the three requirements as Mutual Exclusion, Progress, and Bounded Waiting. \"Bounded Execution\" is a fabricated term."], [5, "m", "In Peterson’s Solution for two processes, what two variables are shared between the processes?", "An integer <code>turn</code> and a Boolean array <code>flag</code>.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"The two processes share two variables: <code>int turn;</code> and <code>Boolean flag[2]</code>.\""], [5, "m", "What does the <code>test_and_set</code> hardware instruction do?", "It returns the original value of the passed parameter and sets the new value to TRUE, executing atomically.\n\n<span class=\"mu\">Why: </span>The slides define <code>test_and_set</code> as returning the original value (<code>rv = <i>target</code>) and setting the target to TRUE (<code></i>target = TRUE</code>), and notes it is \"executed atomically.\""], [5, "m", "Because a mutex lock requires a process to busy wait while trying to acquire the lock, this type of lock is also known as a:", "Spinlock.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"But this solution requires busy waiting. This lock therefore called a spinlock.\""], [5, "m", "In the implementation of a semaphore <i>without</i> busy waiting, what does the <code>wait(S)</code> operation do if <code>S-&gt;value</code> becomes less than 0?", "It adds the process to the semaphore's waiting list and invokes <code>block()</code>.\n\n<span class=\"mu\">Why: </span>The slides show the code for <code>wait(S)</code>: <code>if (S-&gt;value &lt; 0) { add this process to S-&gt;list; block(); }</code>."], [5, "m", "What is \"priority inversion\"?", "A scheduling problem where a lower-priority process holds a lock needed by a higher-priority process.\n\n<span class=\"mu\">Why: </span>The slides explicitly define priority inversion as a \"Scheduling problem when lower-priority process holds a lock needed by higher-priority process.\""], [5, "m", "How is the priority inversion problem typically solved?", "Via the priority-inheritance protocol.\n\n<span class=\"mu\">Why: </span>The slides explicitly state that priority inversion is \"Solved via priority-inheritance protocol.\""], [5, "m", "In the Bounded-Buffer problem, what are the initial values of the <code>mutex</code>, <code>full</code>, and <code>empty</code> semaphores, respectively?", "1, 0, and n (where n is the number of buffers).\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Semaphore mutex initialized to the value 1. Semaphore full initialized to the value 0. Semaphore empty initialized to the value n.\""], [5, "m", "In the Readers-Writers problem, why does the first reader execute <code>wait(rw_mutex)</code>?", "To lock out any writers from accessing the data set while readers are reading.\n\n<span class=\"mu\">Why: </span>The first reader locks <code>rw_mutex</code> to ensure that if a writer is waiting, it cannot enter. Subsequent readers do not need to lock <code>rw_mutex</code> again, allowing multiple readers to read concurrently while blocking writers."], [5, "m", "Which of the following is a proposed deadlock handling solution for the Dining-Philosophers problem?", "Allow at most 4 philosophers to be sitting simultaneously at the table.\n\n<span class=\"mu\">Why: </span>The slides explicitly list this as a deadlock handling solution: \"Allow at most 4 philosophers to be sitting simultaneously at the table.\""], [5, "m", "What is a \"Monitor\" in the context of process synchronization?", "A high-level abstraction that provides a convenient mechanism for synchronization, where only one process may be active within it at a time.\n\n<span class=\"mu\">Why: </span>The slides define a monitor as \"A high-level abstraction that provides a convenient and effective mechanism for process synchronization... Only one process may be active within the monitor at a time.\""], [5, "m", "In a monitor, if a process invokes <code>x.signal()</code> and another process is suspended in <code>x.wait()</code>, what happens under the \"signal and wait\" option?", "The signaling process (P) waits until the resumed process (Q) either leaves the monitor or waits for another condition.\n\n<span class=\"mu\">Why: </span>The slides define \"Signal and wait\" as: \"P waits until Q either leaves the monitor or it waits for another condition.\""], [5, "m", "Which synchronization mechanism does Solaris use for efficiency when protecting data from short code segments, starting as a standard semaphore spin-lock?", "Adaptive mutexes.\n\n<span class=\"mu\">Why: </span>The slides state Solaris \"Uses adaptive mutexes for efficiency when protecting data from short code segments. Starts as a standard semaphore spin-lock.\""], [5, "m", "In Windows synchronization, what are the two possible states of a dispatcher object?", "Signaled-state (object available) or non-signaled state (thread will block).\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Dispatcher objects either signaled-state (object available) or non-signaled state (thread will block).\""], [5, "m", "Prior to kernel version 2.6, how did Linux implement short critical sections?", "By disabling interrupts.\n\n<span class=\"mu\">Why: </span>The slides state: \"Linux: Prior to kernel Version 2.6, disables interrupts to implement short critical sections.\""], [5, "m", "Which of the following is listed as a <i>non-portable</i> extension in the Pthreads API?", "Read-write locks and spinlocks.\n\n<span class=\"mu\">Why: </span>The slides state: \"Non-portable extensions include: read-write locks, spinlocks.\""], [5, "m", "What is \"Transactional Memory\"?", "A sequence of read-write operations to memory that are performed atomically.\n\n<span class=\"mu\">Why: </span>The slides define Transactional Memory as: \"A memory transaction is a sequence of read-write operations to memory that are performed atomically.\""], [5, "m", "In OpenMP, how is a critical section identified so that it is performed atomically?", "Using the <code>#pragma omp critical</code> directive.\n\n<span class=\"mu\">Why: </span>The slides explicitly show: \"The code contained within the <code>#pragma omp critical</code> directive is treated as a critical section and performed atomically.\""], [5, "m", "What is a key characteristic of Functional Programming Languages that helps handle data races?", "Variables are treated as immutable and cannot change state once assigned a value.\n\n<span class=\"mu\">Why: </span>The slides state: \"Variables are treated as immutable and cannot change state once they have been assigned a value. There is increasing interest in functional languages... for their approach in handling data races.\""], [5, "m", "In the <code>compare_and_swap</code> instruction, when does the swap actually take place?", "Only if the current <code>*value</code> is equal to the <code>expected</code> value.\n\n<span class=\"mu\">Why: </span>The slides define <code>compare_and_swap</code> with the logic: <code>if (<i>value == expected) </i>value = new_value;</code>. The swap is conditional."], [5, "m", "What does the \"Progress\" requirement of the critical-section problem state?", "If no process is in its critical section and some wish to enter, the selection of the next process cannot be postponed indefinitely.\n\n<span class=\"mu\">Why: </span>The slides explicitly define Progress as: \"If no process is executing in its critical section and there exist some processes that wish to enter... the selection of the processes that will enter the critical section next cannot be postponed indefinitely.\""], [5, "m", "In the Dining-Philosophers problem, what is the \"asymmetric solution\" to prevent deadlock?", "An odd-numbered philosopher picks up the left chopstick first, then the right; an even-numbered philosopher picks up the right first, then the left.\n\n<span class=\"mu\">Why: </span>The slides explicitly list this as the asymmetric solution: \"an odd-numbered philosopher picks up first the left chopstick and then the right chopstick. Even-numbered philosopher picks up first the right chopstick and then the left chopstick.\""], [5, "m", "What is \"Starvation\" in the context of semaphores?", "Indefinite blocking, where a process may never be removed from the semaphore queue in which it is suspended.\n\n<span class=\"mu\">Why: </span>The slides explicitly define Starvation as \"indefinite blocking. A process may never be removed from the semaphore queue in which it is suspended.\""], [5, "m", "In the Readers-Writers problem, what is the purpose of the <code>mutex</code> semaphore (initialized to 1)?", "To ensure mutual exclusion when updating the <code>read_count</code> variable.\n\n<span class=\"mu\">Why: </span>The slides show the reader process executing <code>wait(mutex)</code> immediately before <code>read_count++</code> and <code>signal(mutex)</code> after, protecting the shared integer update."], [6, "m", "According to the slides, process execution consists of a cycle of:", "CPU execution and I/O wait.\n\n<span class=\"mu\">Why: </span>The slides explicitly state under \"Basic Concepts\" that \"Process execution consists of a cycle of CPU execution and I/O wait\" (CPU burst followed by I/O burst)."], [6, "m", "Which of the following is NOT a task performed by the dispatcher module?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) Switching context.<br>B) Allocating main memory to the process.<br>C) Switching to user mode.<br>D) Jumping to the proper location in the user program to restart it.</div>", "Allocating main memory to the process.\n\n<span class=\"mu\">Why: </span>The slides list the dispatcher's tasks as: \"switching context, switching to user mode, jumping to the proper location in the user program to restart that program.\" Memory allocation is a memory management function, not a dispatcher function."], [6, "m", "CPU scheduling decisions may take place when a process switches from the waiting state to the ready state. This type of scheduling is classified as:", "Preemptive.\n\n<span class=\"mu\">Why: </span>The slides state that scheduling under switching from running to waiting, or terminating, is nonpreemptive. \"All other scheduling is preemptive,\" which includes switching from waiting to ready."], [6, "m", "Which of the following represents the correct optimization criteria for CPU scheduling?", "Maximize CPU utilization, maximize throughput, and minimize waiting time.\n\n<span class=\"mu\">Why: </span>The slides explicitly list the optimization criteria as: \"Max CPU utilization, Max throughput, Min turnaround time, Min waiting time, Min response time.\""], [6, "m", "What is the \"convoy effect\" associated with First-Come, First-Served (FCFS) scheduling?", "Short processes get stuck behind a long process, increasing average waiting time.\n\n<span class=\"mu\">Why: </span>The slides define the convoy effect as a \"short process behind long process,\" which results in a much higher average waiting time compared to other scheduling orders."], [6, "m", "Why is Shortest-Job-First (SJF) scheduling considered optimal?", "τ_(n + 1) = τ_(n) (Recent history does not count).\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"SJF is optimal – gives minimum average waiting time for a given set of processes.\""], [6, "m", "In priority scheduling, what is the standard solution to the problem of \"starvation\" for low-priority processes?", "Aging.\n\n<span class=\"mu\">Why: </span>The slides explicitly state under Priority Scheduling: \"Problem = Starvation... Solution = Aging – as time progresses increase the priority of the process.\""], [6, "m", "In Round Robin (RR) scheduling, what is the performance consequence if the time quantum (q) is extremely large?", "It degenerates into a First-Come, First-Served (FCFS) algorithm.\n\n<span class=\"mu\">Why: </span>The slides explicitly state under Round Robin performance: \"q large ⇒ FIFO\" (First-In, First-Out, which is FCFS)."], [6, "m", "Which of the following is a defining characteristic of Multilevel Queue scheduling?", "A process is permanently assigned to a given queue.\n\n<span class=\"mu\">Why: </span>The slides state for Multilevel Queue: \"Process permanently in a given queue.\""], [6, "m", "A Multilevel Feedback Queue scheduler is defined by several parameters. Which of the following is NOT one of them?<div class=\"mu\" style=\"font-size:.9rem;margin-top:6px\">A) The number of queues.<br>B) The scheduling algorithms for each queue.<br>C) The method used to determine when to upgrade or demote a process.<br>D) The physical hardware affinity of the CPU cores.</div>", "The physical hardware affinity of the CPU cores.\n\n<span class=\"mu\">Why: </span>The slides list the parameters as: number of queues, scheduling algorithms for each queue, method to upgrade, method to demote, and method to determine which queue a process enters. Hardware affinity is a multiprocessor scheduling concept, not a parameter of the MLFQ definition."], [6, "m", "In thread scheduling, what does \"process-contention scope\" (PCS) mean?", "Scheduling competition occurs only among threads within the same process.\n\n<span class=\"mu\">Why: </span>The slides define PCS as: \"Known as process-contention scope (PCS) since scheduling competition is within the process.\""], [6, "m", "In the Pthreads API, which constant is used to schedule threads using system-contention scope (SCS)?", "<code>PTHREAD_SCOPE_SYSTEM</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"<code>PTHREAD_SCOPE_SYSTEM</code> schedules threads using SCS scheduling.\""], [6, "m", "In multiple-processor scheduling, what is \"pull migration\"?", "An idle processor pulls a waiting task from a busy processor.\n\n<span class=\"mu\">Why: </span>The slides define load balancing methods, stating: \"Pull migration – idle processors pulls waiting task from busy processor.\""], [6, "m", "What is \"processor affinity\" in the context of multiple-processor scheduling?", "The tendency of a process to have an affinity for the processor on which it is currently running.\n\n<span class=\"mu\">Why: </span>The slides explicitly define processor affinity as: \"process has affinity for processor on which it is currently running.\""], [6, "m", "Which two types of latencies specifically affect the performance of real-time CPU scheduling?", "Interrupt latency and dispatch latency.\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Two types of latencies affect performance: 1. Interrupt latency... 2. Dispatch latency.\""], [6, "m", "In Rate Monotonic Scheduling, how is priority assigned to periodic tasks?", "Shorter periods are assigned higher priority; longer periods are assigned lower priority.\n\n<span class=\"mu\">Why: </span>The slides explicitly state for Rate Monotonic Scheduling: \"A priority is assigned based on the inverse of its period. Shorter periods = higher priority; Longer periods = lower priority.\""], [6, "m", "How does Earliest Deadline First (EDF) scheduling determine priority?", "The earlier the deadline, the higher the priority.\n\n<span class=\"mu\">Why: </span>The slides explicitly state for EDF: \"Priorities are assigned according to deadlines: the earlier the deadline, the higher the priority; the later the deadline, the lower the priority.\""], [6, "m", "The POSIX.1b standard defines two scheduling classes for real-time threads. What are they?", "<code>SCHED_FIFO</code> and <code>SCHED_RR</code>\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"Defines two scheduling classes for real-time threads: 1. SCHED_FIFO... 2. SCHED_RR.\""], [6, "m", "In Linux version 2.6.23+, the Completely Fair Scheduler (CFS) decides which task to run next by picking the task with:", "The lowest virtual run time (<code>vruntime</code>).\n\n<span class=\"mu\">Why: </span>The slides explicitly state: \"To decide next task to run, scheduler picks task with lowest virtual run time.\""], [6, "m", "In the Windows 32-level priority scheme, which priority level is reserved for the memory-management thread?", "Priority 0\n\n<span class=\"mu\">Why: </span>The slides explicitly state under Windows Scheduling: \"Priority 0 is memory-management thread.\""], [6, "m", "What is \"User-Mode Scheduling\" (UMS), which was added in Windows 7?", "A mechanism allowing applications to create and manage threads independent of the kernel, efficient for large numbers of threads.\n\n<span class=\"mu\">Why: </span>The slides state: \"Windows 7 added user-mode scheduling (UMS). Applications create and manage threads independent of kernel. For large number of threads, much more efficient.\""], [6, "m", "(Self-Correction during drafting: Ensure Q23-25 maintain the even distribution. Currently A:7, B:6, C:6, D:6. Need one more A, or adjust. Let's make Q23 C, Q24 D, Q25 A.)*   **Solaris provides six scheduling classes. Which of the following is the default class?", "Time sharing (TS)\n\n<span class=\"mu\">Why: </span>The slides explicitly list the six classes and note: \"Time sharing (default) (TS)\"."], [6, "m", "According to Little’s Formula in queueing models, what is the relationship between average queue length (n), average arrival rate (λ), and average waiting time (W)?", "n = λ × W\n\n<span class=\"mu\">Why: </span>The slides explicitly state Little's law as: \"n = λ × W\"."], [6, "m", "What is \"deterministic modeling\" in the context of CPU scheduling algorithm evaluation?", "Taking a particular predetermined workload and defining the performance of each algorithm for that specific workload.\n\n<span class=\"mu\">Why: </span>The slides define deterministic modeling as an analytic evaluation that \"Takes a particular predetermined workload and defines the performance of each algorithm for that workload.\""], [6, "m", "In the exponential averaging formula for predicting the next CPU burst (τ(n+1) = α·t(n) + (1−α)·τ(n)), what happens when α = 0?", "τ(n+1) = τ(n): recent history does not count.\n\n<span class=\"mu\">Why: </span>With α = 0 the whole weight is on the old prediction. α = 1 is the case where only the actual last burst counts."]]);

${d?`<p class="mu">${i+1} / ${deck.length}</p><div class="card" id="cd"><div class="tag">Ch ${d[0]} · ${d[1]=='c'?'Compare / list':d[1]=='m'?'From your MCQs':'Short answer'}</div><div class="q">${d[2]}</div>
${mode=='write'?'<textarea id="mine" rows="3" placeholder="Type your answer first..." onclick="event.stopPropagation()">'+esc(mineBy[d[2]]||'')+'</textarea>':''}
${show?`<div class="ans">${d[3]}</div>`:'<p class="mu">'+(mode=='write'?'Click to check your answer':'Click to flip')+'</p>'}</div>
${mode=='write'&&gr[d[2]]?resHTML(gr[d[2]]):''}<div class="row">${mode=='write'?'<button id="sb" class="on">Submit answer</button>':''}<button id="pv">Prev</button><button id="nx">Next</button><button id="gt">Got it</button><button id="ag">Again</button><span class="mu">${Object.values(seen).filter(v=>v).length} got it</span></div>`:'<p>No cards.</p>'}`;
app.onclick=e=>{const t=e.target,g=x=>t.dataset[x];
if(g('c')!=null){ch=+g('c');i=0;show=false;fc()}else if(g('k')){kind=g('k');i=0;show=false;fc()}else if(g('m')){mode=g('m');fc()}
else if(t.id=='sh'){D.sort(()=>Math.random()-.5);i=0;show=false;fc()}else if(t.closest('#cd')){const m=$('#mine');if(m)mineBy[d[2]]=m.value;show=!show;fc()}
else if(t.id=='sb'){subFc(d)}else if(t.id=='nx'){i=(i+1)%deck.length;show=false;fc()}else if(t.id=='pv'){i=(i-1+deck.length)%deck.length;show=false;fc()}
else if(t.id=='gt'){seen[d[2]]=1;i=(i+1)%deck.length;show=false;fc()}else if(t.id=='ag'){seen[d[2]]=0;i=(i+1)%deck.length;show=false;fc()}}}
function code(){app.innerHTML=`<p class="mu">Try each one yourself, then reveal. Runnable questions use an in-browser C interpreter. fork/exec/threads cannot run in a browser, so trace those by hand.</p>`+C.map((c,k)=>`<div class="box"><div class="tag">Q${k+1} · Ch ${c.ch} · ${c.type}</div><h3>${c.t}</h3><p>${c.q}</p>${c.code?`<textarea class="ed" id="e${k}" spellcheck="false">${esc(c.code)}</textarea>`:`<textarea class="ed" id="e${k}" rows="3" placeholder="Your working..."></textarea>`}
<div class="row">${c.run?`<button data-run="${k}">Run</button>`:''}<button data-rv="${k}">Reveal answer</button></div><pre class="out" id="o${k}" hidden></pre><div id="r${k}" hidden><div class="ans">${esc(c.ans)}</div><div class="ex"><b>Why:</b> ${esc(c.why)}<br><span class="tag">Source: ${c.src}</span></div>${c.st?'<h3>Walk through, line by line</h3>'+wtHTML('wc'+k,c.full||c.code,c.st):''}</div></div>`).join('');
app.onclick=e=>{const t=e.target;if(t.dataset.rv){$('#r'+t.dataset.rv).hidden=false}
if(t.dataset.run){const k=t.dataset.run,o=$('#o'+k);o.hidden=false;let s='';
try{if(!window.JSCPP)throw Error('C interpreter did not load (check connection).');JSCPP.run($('#e'+k).value.replace(/___/g,'0'),'',{stdio:{write:x=>s+=x}});o.textContent=s}catch(err){o.textContent='Error: '+(err.message||err)+'\n'+s}}};
app.onkeydown=e=>{if(e.key=='Tab'&&e.target.classList.contains('ed')){e.preventDefault();const a=e.target,p=a.selectionStart;a.setRangeText('  ',p,a.selectionEnd,'end')}}}
function big(){app.innerHTML=`<div class="row">${CH.map((c,k)=>`<button class="${k==ch?'on':''}" data-c="${k}">${c}</button>`).join('')}</div>`+L.map((x,k)=>({x,k})).filter(o=>!ch||o.x.ch==ch).map(({x,k})=>`<div class="box"><div class="tag">Ch ${x.ch} · 15 marks</div><h3>${x.t}</h3><ol>${x.parts.map(p=>`<li>${p[0]}</li>`).join('')}</ol><textarea rows="6" id="lw${k}" placeholder="Write your answer first..."></textarea><div class="row"><button data-lg="${k}" class="on">Submit for marking</button></div><div id="lr${k}"></div><details><summary>Model answer and explanation</summary><div class="ans">${esc(x.ans)}</div><div class="ex"><b>Why it is asked:</b> ${x.why}</div></details></div>`).join('');
app.onclick=e=>{if(e.target.dataset.c!=null){ch=+e.target.dataset.c;big()}else if(e.target.dataset.lg!=null)gradeL(+e.target.dataset.lg)}}
function lab(){app.innerHTML=`<p class="mu">Enter processes as: name arrival burst (one per line).</p><textarea id="ps" rows="5">P1 0 24
P2 0 3
P3 0 3</textarea><div class="row"><select id="al"><option value="fcfs">FCFS</option><option value="sjf">SJF (non-preemptive)</option><option value="srtf">SRTF (preemptive SJF)</option><option value="rr">Round Robin</option></select>Quantum <select id="q">${[1,2,3,4,5,8].map(n=>`<option ${n==4?'selected':''}>${n}</option>`).join('')}</select><button id="go">Run</button></div><pre id="res" class="out"></pre>`;
app.onclick=e=>{if(e.target.id!='go')return;const ps=$('#ps').value.trim().split('\n').map(l=>l.trim().split(/\s+/)).map(a=>({n:a[0],a:+a[1],b:+a[2]})).filter(p=>p.n&&p.b>0),al=$('#al').value,q=+$('#q').value;
let t=0,rem=ps.map(p=>p.b),done=0,fin=[],g=[],cur=-1,qu=[],qt=0,seen=new Set();
while(done<ps.length&&t<2000){ps.forEach((p,j)=>{if(p.a<=t&&!seen.has(j)){seen.add(j);qu.push(j)}});
const r=ps.map((p,j)=>j).filter(j=>ps[j].a<=t&&rem[j]>0);
if(al=='rr'){if(cur<0||rem[cur]==0||qt==q){if(cur>=0&&rem[cur]>0)qu.push(cur);cur=qu.length?qu.shift():-1;qt=0}}
else if(al=='srtf')cur=r.sort((x,y)=>rem[x]-rem[y])[0]??-1;
else if(cur<0||rem[cur]==0)cur=(al=='fcfs'?r.sort((x,y)=>ps[x].a-ps[y].a):r.sort((x,y)=>rem[x]-rem[y]))[0]??-1;
if(cur>=0){g.push(ps[cur].n);rem[cur]--;qt++;if(rem[cur]==0){fin[cur]=t+1;done++}}else g.push('idle');t++}
let s=[],st=0;g.forEach((n,k)=>{if(g[k+1]!==n){s.push(`${n}[${st}-${k+1}]`);st=k+1}});
const rows=ps.map((p,j)=>{const ta=fin[j]-p.a;return {n:p.n,ta,w:ta-p.b}});
$('#res').textContent='Gantt: '+s.join(' ')+'\n\n'+rows.map(r=>`${r.n}: turnaround ${r.ta}, waiting ${r.w}`).join('\n')+`\n\nAverage waiting = ${(rows.reduce((a,r)=>a+r.w,0)/rows.length).toFixed(2)}\nAverage turnaround = ${(rows.reduce((a,r)=>a+r.ta,0)/rows.length).toFixed(2)}`}}
draw();
</script></body></html>
